[project]
name = "agent-guard"
version = "0.1.0"
description = "Minimal, stdlib-only circuit breaker for AI agent tool-call loops."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Divya Teja Palla"}]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent_guard"]
